# PostgreSQL local para desarrollo (yarn dev).
# Puerto 5434 en host — evita conflicto con otros proyectos en 5433.
services:
  consultas-refugio-pg:
    image: postgres:16-alpine
    container_name: consultas-refugio-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: consultas_refugio
    ports:
      - "5434:5432"
    volumes:
      - consultas_refugio_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d consultas_refugio"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  consultas_refugio_pgdata:
